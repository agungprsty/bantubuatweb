# Site nginx: sudo cp deploy/nginx.conf /etc/nginx/sites-available/bantubuat.web.id
# SSL ditambahkan oleh `certbot --nginx` setelah DNS mengarah ke VPS (lihat README).

server {
	listen 80;
	listen [::]:80;
	server_name www.bantubuat.web.id;
	return 301 https://bantubuat.web.id$request_uri;
}

server {
	listen 80;
	listen [::]:80;
	server_name bantubuat.web.id;

	# IP asli pengunjung hanya dibaca dari CF-Connecting-IP jika request datang dari Cloudflare.
	# Daftar dari https://www.cloudflare.com/ips/ (perbarui jika Cloudflare mengubahnya).
	set_real_ip_from 173.245.48.0/20;
	set_real_ip_from 103.21.244.0/22;
	set_real_ip_from 103.22.200.0/22;
	set_real_ip_from 103.31.4.0/22;
	set_real_ip_from 141.101.64.0/18;
	set_real_ip_from 108.162.192.0/18;
	set_real_ip_from 190.93.240.0/20;
	set_real_ip_from 188.114.96.0/20;
	set_real_ip_from 197.234.240.0/22;
	set_real_ip_from 198.41.128.0/17;
	set_real_ip_from 162.158.0.0/15;
	set_real_ip_from 104.16.0.0/13;
	set_real_ip_from 104.24.0.0/14;
	set_real_ip_from 172.64.0.0/13;
	set_real_ip_from 131.0.72.0/22;
	set_real_ip_from 2400:cb00::/32;
	set_real_ip_from 2606:4700::/32;
	set_real_ip_from 2803:f800::/32;
	set_real_ip_from 2405:b500::/32;
	set_real_ip_from 2405:8100::/32;
	set_real_ip_from 2a06:98c0::/29;
	set_real_ip_from 2c0f:f248::/32;
	real_ip_header CF-Connecting-IP;

	gzip on;
	gzip_proxied any;
	gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

	client_max_body_size 5m;

	location / {
		proxy_pass http://127.0.0.1:3100;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		# dipakai app untuk rate limit (server/utils/rateLimit.ts); selalu ditimpa, tidak bisa dipalsukan klien
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
}
